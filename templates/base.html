<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FHIR Lab Explorer</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 900px;
           margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: .3rem; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: .92rem; }
    th { background: #f7f7f7; }
    input[type=text] { padding: 6px 8px; font-size: .95rem; }
    button { padding: 6px 14px; font-size: .95rem; cursor: pointer; }
    .muted { color: #777; font-size: .85rem; }
    .error { background: #fdecea; border: 1px solid #f5c2c0; padding: 10px 14px; border-radius: 4px; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
    a { color: #2b5fad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #f2f2f2; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <p><a href="/">&larr; FHIR Lab Explorer</a> &nbsp;|&nbsp; <a href="/stats">Daily stats</a></p>
  {% block content %}{% endblock %}
</body>
</html>
